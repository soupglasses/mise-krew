[env]
MISE_USE_VERSIONS_HOST = "0"
_.path = ["~/.luarocks/bin"]

[tools]
actionlint = "latest"
hk = "1.45.0"
lua = "5.4"
pkl = "0.31.1"
stylua = "2.4.1"

[tasks.format]
description = "Format Lua scripts"
run = "stylua metadata.lua hooks/"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "hk check"

[tasks.test-unit]
description = "Run Lua unit tests"
run = [
    "lua tests/run_tests.lua",
    "bash tests/test_registry_concurrency.sh",
]

[tasks.test-integration]
description = "Run integration tests against the linked backend plugin"
run = [
    "mise plugin link --force krew .",
    "bash tests/integration_test.sh",
]

[tasks.test]
description = "Run lint + unit + integration tests"
depends = ["lint", "test-unit", "test-integration"]
