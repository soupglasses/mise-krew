apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: view-serviceaccount-kubeconfig
spec:
  version: v2.2.8
  shortDescription: Show a kubeconfig setting to access the apiserver with a specified
    serviceaccount.
  homepage: https://github.com/superbrothers/kubectl-view-serviceaccount-kubeconfig-plugin
  description: Show a kubeconfig setting to access the apiserver with a specified
    serviceaccount.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://example.com/view-serviceaccount-kubeconfig.tar.gz
    sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    bin: kubectl-view_serviceaccount_kubeconfig
